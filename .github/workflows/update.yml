name: Weekly internship update

on:
  schedule:
    # Every Monday at 10:23 UTC (5:23 AM Eastern in winter, 6:23 AM in summer)
    - cron: "23 10 * * 1"
  workflow_dispatch: # lets you click "Run workflow" on the Actions tab any time
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - "site/**"
      - "companies.toml"
      - ".github/workflows/update.yml"

permissions:
  contents: write # save data/seen.json (first-seen dates) back to the repo
  pages: write
  id-token: write

concurrency:
  group: internship-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Collect internships and build the site
        run: python -m tracker.build --previous-url "${{ steps.pages.outputs.base_url }}/data/jobs.json"

      - name: Save first-seen dates
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Weekly update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
