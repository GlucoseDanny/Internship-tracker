# Companies the tracker checks directly on their own career sites.
#
# Every entry needs:
#   name    - how the company shows on the page
#   sector  - one of: space, defense, aviation, lab, other
#   ats     - which job system the company uses (see below)
# plus the fields that job system needs.
#
#   ats = "greenhouse"       slug = "spacex"            (boards.greenhouse.io/<slug>)
#   ats = "lever"            slug = "hermeus"           (jobs.lever.co/<slug>)
#   ats = "ashby"            slug = "saronic"           (jobs.ashbyhq.com/<slug>)
#   ats = "workday"          host = "boeing.wd1.myworkdayjobs.com", site = "EXTERNAL_CAREERS"
#   ats = "successfactors"   host = "jobs.ornl.gov"
#   ats = "oracle"           host = "...oraclecloud.com", site = "CX"
#   ats = "smartrecruiters"  slug = "LLNL"
#   ats = "jibe"             host = "careers.jhuapl.edu"
#
# Companies NOT listed here still show up if they appear on the community
# internship lists (SimplifyJobs and others); this file is for employers we
# want full job descriptions from.

